name: CI
permissions:
    contents: write
on:
  push:
    branches: [ "main" ]
    tags: 'v*'
    paths:
      - 'src/**'
      - 'Dockerfile'

env:
  VERSION: ${{ github.ref_name }}

jobs:
  # This workflow contains a single job called "build"
  build:
    
    runs-on: self-hosted

    steps:
      - name: Checkout own repo
        uses: actions/checkout@v4
        with:
          path: main-repo
          fetch-depth: 0
          persist-credentials: true

      - name: Clone external repo
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          path: external-repo

        # METHOD 1: Checking for dockerfile changes and making 
      - name: check for dockerfile changes
        id: dockerfile_check
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q '^Dockerfile$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        if: steps.dockerfile_check.outputs.changed == 'true'
        run: |
          docker build -t firmware_builder:latest ./main-repo/

          # METHOD 2: Checking for dockerfile changes and making 
      # - name: Check for Dockerfile changes
      #   id: change
      #   uses: tj-actions/changed-files@v5
      #   with:
      #     files: main-repo/Dockerfile

      # - name: Build new image
      #   # if: steps.change.outputs.any_change == 'true'
      #   run: docker build -t firmware_builder:latest ./main-repo/


      # - name: Build Docker Image
      #   run: docker build -t firmware_builder:latest ./main-repo/ 

      - name: Mkdir build/
        working-directory: ${{ github.workspace}}/main-repo
        run: mkdir -p build

      - name: Build
        run: |
          docker run --rm \
          -u "$(id -u):$(id -g)" \
          --name firmware_builder_container \
          -v "${{ github.workspace }}/main-repo/src:/work/src" \
          -v "${{ github.workspace }}/external-repo:/work/pico-sdk" \
          -v "${{ github.workspace }}/main-repo/build:/work/build" \
          -e PICO_SDK_PATH=/work/pico-sdk \
          firmware_builder:latest \
          bash -c " cmake -S /work/src -B /work/build -G Ninja && cmake --build /work/build "

      - name: Version artifact
        working-directory: main-repo/build
        shell: bash
        run: |
          echo "$VERSION"

          for file in *.u2f; do
            [ -f "$file" ] || continue
            base=${file%.u2f}
            mv "$file" "${base}-${VERSION}.u2f"
          done

      - name: Push firmware
        if: github.event_name == 'push'
        working-directory: main-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add build/*.uf2

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Push firmware [skip ci]"
          git push