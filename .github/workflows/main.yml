name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Dockerfile'
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    
    runs-on: self-hosted

    steps:
      - name: Checkout own repo
        uses: actions/checkout@v4
        with:
          path: main-repo
          fetch-depth: 0

      - name: Clone external repo
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          path: external-repo

      # - name: Checkout
      #   uses: actions/checkout@v4
      #   with:
      #     fetch-depth: 0
      
      - name: Check for Dockerfile changes
        id: change
        uses: tj-actions/changed-files@v5
        with:
          files: main-repo/Dockerfile

      - name: Build new image
        if: steps.change.outputs.any_change == 'true'
        run: docker build -t firmware_builder:latest ./main-repo/

      - name: Mkdir build/
        working-directory: ${{ github.workspace}}
        run: mkdir -p build

      - name: Build
        run: |
          docker run --rm \
          -u "$(id -u):$(id -g)" \
          --name firmware_builder_container \
          -v "${{ github.workspace }}/main-repo/src:/work/src" \
          -v "${{ github.workspace }}/external-repo:/work/pico-sdk" \
          -v "${{ github.workspace }}/build:/work/build" \
          -e PICO_SDK_PATH=/work/pico-sdk \
          firmware_builder:latest \
          bash -c " cmake -S /work/src -B /work/build -G Ninga && cmake --build /work/build "
